name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: node tests/test.js
      - name: Prepare web assets
        run: mkdir -p www && cp index.html style.css app.js logic.js sites.js manifest.json sw.js icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Locate APK
        run: |
          find android -name "*.apk"
          cp "$(find android -name 'app-debug.apk' | head -1)" DutyScheduler.apk
          ls -l DutyScheduler.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DutyScheduler-apk
          path: DutyScheduler.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Duty Scheduler APK
          files: DutyScheduler.apk
