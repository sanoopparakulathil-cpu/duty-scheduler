name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        id: build
        run: |
          set +e
          VCODE=${{ github.run_number }} bash ci/build.sh > /tmp/build.log 2>&1
          echo "exit=$?" >> /tmp/build.log
          tail -n 80 /tmp/build.log
          grep -q '^exit=0$' /tmp/build.log
      - name: Push log on failure
        if: failure()
        run: |
          mkdir /tmp/lg && cp /tmp/build.log /tmp/lg/build.log || echo nolog > /tmp/lg/build.log
          cd /tmp/lg && tail -c 60000 build.log > b && mv b build.log
          git init -q -b buildlog && git config user.email a@b.c && git config user.name ci
          git add . && git commit -qm log && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: DutyScheduler-apk
          path: DutyScheduler.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Duty Scheduler APK
          files: DutyScheduler.apk
